name: "DS → FE: Sync Design Tokens"

on:
  push:
    branches: [main]
    paths:
      - "src/tokens/**" # 토큰 원본 + 변환 스크립트
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  FE_OWNER: "finditem"
  FE_TARGET_DIR: "src/utils/tokens" # FE에서 둘 위치
  TW_ARTIFACT: "src/tokens/build/tailwind.config.js" # 빌드 산출물
  PR_BRANCH: "chore/update-design-tokens"
  COMMIT_MSG: "chore(tokens): sync from FI-DS [skip ci]"

jobs:
  build-and-pr:
    runs-on: ubuntu-latest
    # 같은 토큰 산출물을 운영 앱과 어드민 저장소에 각각 PR로 보낸다.
    # 커밋과 PR은 finditem-bot App 명의로 생성된다.
    strategy:
      fail-fast: false
      matrix:
        fe_repo: ["FI-FE", "admin"]

    steps:
      - name: Checkout DS
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Build tokens
        run: npm run build:tokens

      - name: Verify output
        run: |
          if [ ! -s "${{ env.TW_ARTIFACT }}" ]; then
            echo "::error::빌드 산출물이 없습니다: ${{ env.TW_ARTIFACT }}"
            exit 1
          fi
          echo "Found ${{ env.TW_ARTIFACT }}"

      # 대상 저장소에 쓸 수 있는 App 설치 토큰 발급 (1시간 유효)
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.FE_OWNER }}
          repositories: ${{ matrix.fe_repo }}

      - name: Checkout FE
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FE_OWNER }}/${{ matrix.fe_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: fe

      - name: Sync artifacts into FE
        run: |
          mkdir -p "fe/${{ env.FE_TARGET_DIR }}"
          cp -f "${{ env.TW_ARTIFACT }}" "fe/${{ env.FE_TARGET_DIR }}/tailwind.config.js"

      - name: Open PR (let action commit & open)
        uses: peter-evans/create-pull-request@v6
        with:
          path: fe
          token: ${{ steps.app-token.outputs.token }}
          branch: ${{ env.PR_BRANCH }}
          base: develop
          title: "chore(tokens): sync from FI-DS"
          body: |
            자동 동기화 — FI-DS → ${{ env.FE_OWNER }}/${{ matrix.fe_repo }}
            - Style Dictionary 산출물 업데이트
          labels: "design-tokens, 🤖 automated"
          commit-message: ${{ env.COMMIT_MSG }}
          committer: "finditem-bot[bot] <289664574+finditem-bot[bot]@users.noreply.github.com>"
          author: "finditem-bot[bot] <289664574+finditem-bot[bot]@users.noreply.github.com>"
          signoff: false
          delete-branch: false
          add-paths: |
            ${{ env.FE_TARGET_DIR }}/tailwind.config.js
